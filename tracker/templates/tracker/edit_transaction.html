{% extends 'tracker/base.html' %}

{% block content %}
<div class="flex justify-center items-center mt-10 mb-10">
    <div class="card w-full max-w-lg bg-base-100 shadow-xl">
        <div class="card-body">
            <h2 class="card-title text-2xl font-bold justify-center mb-4">Edit Transaction</h2>
            
            <form method="POST">
                {% csrf_token %}
                <div class="form-control w-full flex flex-col gap-4">
                    {% for field in form %}
                        <div>
                            <label class="label pb-1">
                                <span class="label-text font-medium">{{ field.label }}</span>
                            </label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-error text-xs mt-1">{{ field.errors|striptags }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}
                </div>
                
                <div class="card-actions justify-between mt-8">
                    <a href="{% url 'dashboard' %}" class="btn btn-ghost">Cancel</a>
                    <button type="submit" class="btn btn-primary">Update Transaction</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
